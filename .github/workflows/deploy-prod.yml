name: Deploy Prod
on:
  release:
    types: [published]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sfhousing.mindlace.net
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.3.0
      - run: npm ci
      - name: "Guard: this commit's dataset is published"
        id: dataset
        run: |
          V="$(npx tsx scripts/dataset-version.ts --check https://sfhousing.mindlace.net)"
          echo "v=${V}" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply sfhousing --remote
      - uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Omitting --env selects the top-level (production) config.
          command: deploy --tag ${{ github.event.release.tag_name }} --var PUBLIC_APP_RELEASE:${{ github.event.release.tag_name }}
      - name: 'Smoke: dataset manifest is served and the build uses it'
        run: |
          V="${{ steps.dataset.outputs.v }}"
          curl -fsS -o /dev/null -I --retry 5 --retry-delay 10 --retry-all-errors "https://sfhousing.mindlace.net/data/${V}/manifest.json"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "https://sfhousing.mindlace.net/attribution" | grep -qF "${V}"
