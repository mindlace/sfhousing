name: Release Please
on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived GitHub App installation token so the releases and tags
      # release-please publishes are NOT attributed to the default GITHUB_TOKEN.
      # GitHub deliberately suppresses workflow runs for events emitted by
      # GITHUB_TOKEN, which would otherwise stop `deploy-prod` (on: release:
      # published) from ever firing. An App token is a distinct actor, so the
      # `release: published` event propagates and prod deploys run.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - id: rp
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release PRs only modify version files + CHANGELOG; the underlying code was
      # already signed off on main. Auto-post local-ci/signoff to the head SHA so
      # branch protection lets the PR merge without a manual signoff.
      #
      # The head SHA is read with `git ls-remote` (git protocol), not the REST API:
      # REST reads can hit a stale replica and return the pre-push SHA right after
      # release-please updates the branch.
      - name: Auto-signoff release PRs
        if: steps.rp.outputs.prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PRS: ${{ steps.rp.outputs.prs }}
        run: |
          set -euo pipefail
          while IFS= read -r BRANCH; do
            [ -n "$BRANCH" ] || continue
            SHA="$(git ls-remote "https://github.com/${REPO}.git" "refs/heads/${BRANCH}" | cut -f1)"
            if [ -z "$SHA" ]; then
              echo "no head SHA for branch ${BRANCH}"
              exit 1
            fi
            echo "auto-signoff ${BRANCH} @ ${SHA}"
            gh api -X POST "repos/${REPO}/statuses/${SHA}" \
              -f state=success \
              -f context=local-ci/signoff \
              -f description="auto-signoff for release-please PR"
          done < <(jq -r '.[].headBranchName' <<<"$PRS")
